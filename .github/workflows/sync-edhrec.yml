name: Sync EDHREC Data

on:
  # Weekly on Sunday at 7 AM UTC (after daily commander sync)
  schedule:
    - cron: '0 7 * * 0'
  
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no database changes)'
        required: false
        default: 'false'
        type: boolean
      force:
        description: 'Force re-sync all commanders (ignore last sync date)'
        required: false
        default: 'false'
        type: boolean
      limit:
        description: 'Limit number of commanders to sync (0 = all)'
        required: false
        default: '0'
        type: string

env:
  NODE_VERSION: '20'

jobs:
  sync:
    name: Sync EDHREC Commander Data
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Full sync can take ~15-20 min for 500+ commanders

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run EDHREC sync
        run: |
          ARGS="--verbose"
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          
          if [ "${{ github.event.inputs.limit }}" != "0" ] && [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          fi
          
          echo "Running: npx tsx scripts/sync-edhrec-data.ts $ARGS"
          npx tsx scripts/sync-edhrec-data.ts $ARGS
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload tag mapping report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edhrec-sync-report
          path: |
            ../research/edhrec-sync/tag-mapping-report.md
            ../research/edhrec-sync/unmapped-tags.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Create summary
        if: success()
        run: |
          echo "## EDHREC Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sync completed at $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "**Mode:** Dry Run (no changes made)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "../research/edhrec-sync/tag-mapping-report.md" ]; then
            echo "### Tag Mapping Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extract summary section from report
            head -30 ../research/edhrec-sync/tag-mapping-report.md >> $GITHUB_STEP_SUMMARY
          fi
